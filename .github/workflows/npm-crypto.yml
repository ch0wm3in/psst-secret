name: Publish @psst-secret/crypto

# Releases use their own tag prefix, e.g. npm-crypto-v1.0.0, so they do not trigger
# the Docker workflow, which builds on v* tags.
on:
  push:
    tags: ["npm-crypto-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: packages/crypto

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The tag is the source of the version; package.json only holds a placeholder.
      # `npm version` rejects tags that are not valid semver.
      - name: Set the package version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: npm version "${TAG#npm-crypto-v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      # Also checks that the tag's major version matches the format version.
      - name: Run format vector tests
        run: npm test

      - name: Add license
        run: cp ../../LICENSE .

      # Authenticates with npm trusted publishing, which also adds provenance.
      - name: Publish
        run: npm publish --access public
