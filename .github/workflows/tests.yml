name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://psst:psst@localhost:5432/psst_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "true"
      ENABLE_AUTH: "true"
      ENABLE_LOCAL_LOGIN: "true"
      POSTGRES_USER: psst
      POSTGRES_PASSWORD: psst
      POSTGRES_DB: psst_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env for docker compose
        run: |
          cat <<EOF > .env
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          EOF

      - name: Start services from docker-compose
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" && break
            sleep 1
          done

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T redis redis-cli ping | grep -q PONG && break
            sleep 1
          done

      - name: setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        run: uv run pytest

      - name: Stop services
        if: always()
        run: docker compose down
