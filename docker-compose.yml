services:

 psst_secret:
  restart: on-failure
  build: .
  env_file: .env
  ports:
    - "8000:8000"
  depends_on:
    - postgres
    - redis
 postgres:
  restart: on-failure
  image: postgres:18.6
  volumes:
    - pgdata:/var/lib/postgresql/
  env_file: .env
  ports:
    - "127.0.0.1:5432:5432"

 redis:
  restart: on-failure
  image: redis:8.10.2
  command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy noeviction
  ports:
    - "127.0.0.1:6379:6379"

volumes:
  pgdata: