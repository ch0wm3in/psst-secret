{% load i18n static %}
{% if manage_receive_access %}
<section class="border-t border-gray-800 pt-6 mt-6 max-w-md mx-auto space-y-3">
    <h2 class="text-lg font-semibold text-white">{% trans "Reader access" %}</h2>
    <form id="receive-access-form" data-url="{% url 'whispers:api_receive_access' whisper.id %}" class="space-y-3">
        {% csrf_token %}
        <label class="flex items-center gap-2 select-none">
            <input type="checkbox" id="access-creator-only" data-forced="{{ force_receive_access|yesno:'true,false' }}" {% if receive_access.creator_only or force_receive_access %}checked{% endif %} {% if force_receive_access %}disabled title="{% trans 'Restricted receive access is required.' %}"{% endif %}
                class="rounded bg-gray-700 border-gray-600 text-brand-500 focus:ring-brand-500 focus:ring-offset-gray-900">
            <span class="text-sm text-gray-300">{% trans "Only me and approved readers" %}</span>
        </label>
        <div id="access-reader-emails" {% if not receive_access.creator_only and not force_receive_access %}class="hidden"{% endif %}>
            <label for="access-emails" class="block text-sm font-medium text-gray-300 mb-1">{% trans "Additional readers (verified primary emails)" %}</label>
            <textarea id="access-emails" rows="3" autocomplete="off" {% if not receive_access.creator_only and not force_receive_access %}disabled{% endif %}
                class="w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500"
                placeholder="{% trans 'recipient@example.com' %}">{% for email in receive_access.allowed_reader_emails %}{{ email }}{% if not forloop.last %}
{% endif %}{% endfor %}</textarea>
        </div>
        <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold transition">{% trans "Save access" %}</button>
        <p id="access-status" role="status" aria-live="polite" class="text-sm text-gray-400 break-words"></p>
    </form>
</section>
<script src="{% static 'js/receive-access.min.js' %}" defer></script>
{% endif %}
