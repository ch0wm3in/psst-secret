{% load i18n static whispers_extras %}
{% if request.resolver_match.url_name != "receives" %}
<div id="receive-drawer" class="hidden fixed bottom-4 right-4 z-40 flex w-[calc(100%-2rem)] max-w-sm flex-col items-end gap-2">
    <div id="receive-drawer-panel" role="region" aria-labelledby="receive-drawer-title" hidden
        class="w-full rounded-xl bg-gray-900 border border-gray-700 shadow-2xl">
        <div class="flex items-center justify-between gap-2 px-4 py-3 border-b border-gray-800">
            <h2 id="receive-drawer-title" class="text-sm font-semibold text-white">{% trans "Saved receive requests" %}</h2>
            <a href="{% url 'whispers:receives' %}" class="text-xs text-brand-400 hover:text-brand-300 underline transition">{% trans "Open full list" %}</a>
        </div>
        <ul id="receive-drawer-list" class="max-h-72 overflow-y-auto divide-y divide-gray-800"></ul>
    </div>
    <button id="receive-drawer-toggle" type="button" aria-expanded="false" aria-controls="receive-drawer-panel"
        class="inline-flex items-center gap-2 rounded-full bg-gray-800 border border-gray-700 px-4 py-2 text-sm font-medium text-gray-200 shadow-lg hover:bg-gray-700 hover:text-white transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-400">
        {% icon "inbox-stack" %}
        <span>{% trans "Receives" %}</span>
        <span id="receive-drawer-count" class="inline-flex min-w-5 items-center justify-center rounded-full bg-brand-600 px-1.5 text-xs font-semibold text-white">0</span>
    </button>
</div>
{% endif %}
<script src="{% static 'js/receive-history.min.js' %}"></script>
