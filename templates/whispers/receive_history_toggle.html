{% load i18n %}
<div class="rounded-lg bg-gray-800/50 border border-gray-700 p-4 space-y-2">
    <label class="flex items-start gap-2 cursor-pointer select-none">
        <input type="checkbox" id="receive-history-enabled" data-receive-history-toggle aria-describedby="receive-history-tradeoff"
            class="mt-0.5 rounded bg-gray-700 border-gray-600 text-brand-500 focus:ring-brand-500 focus:ring-offset-gray-900">
        <span class="text-sm text-gray-300">{% trans "Keep my receive requests in this browser" %}</span>
    </label>
    <p id="receive-history-tradeoff" class="text-xs text-gray-500">{% trans "Saves each view link and your label in this browser's local storage. Unless the request has a password, the view link contains its private key, so anyone with access to this browser profile can read the received whispers. Labels are never sent to the server." %}</p>
</div>
