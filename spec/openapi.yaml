openapi: 3.0.3
info:
  title: psst-secret API
  version: 1.0.0
  description: End-to-end encrypted secret sharing. The server never sees your plaintext.
paths:
  /api/v1/cli/revoke:
    post:
      operationId: cli_revoke_create
      description: Revoke the API token that authenticates this request (``psst logout``).
      tags:
      - cli
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cli/token:
    post:
      operationId: cli_token_create
      description: Exchange a single-use authorization code and its PKCE verifier
        for an API token.
      tags:
      - cli
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchange'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/info:
    get:
      operationId: info_retrieve
      description: Report the server version, supported versions, and the deployment's
        optional features.
      tags:
      - info
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
          description: ''
  /api/v1/whisper:
    post:
      operationId: whisper_create
      description: |-
        Create a new encrypted whisper.

        Accepts client-side encrypted data and stores it. The server never
        sees the plaintext or the encryption key.
      tags:
      - whisper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWhisper'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWhisperResponse'
          description: ''
  /api/v1/whisper/{whisper_id}/access:
    get:
      operationId: whisper_access_retrieve
      parameters:
      - in: path
        name: whisper_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveAccess'
          description: ''
    patch:
      operationId: whisper_access_partial_update
      parameters:
      - in: path
        name: whisper_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReceiveAccess'
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveAccess'
          description: ''
  /api/v1/whisper/{whisper_id}/reveal:
    post:
      operationId: whisper_reveal_create
      description: JSON-only reveal endpoint of the versioned API.
      parameters:
      - in: path
        name: whisper_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealWhisper'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevealWhisper'
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealWhisperResponse'
          description: ''
  /api/v1/whisper/{whisper_id}/status:
    get:
      operationId: whisper_status_retrieve
      description: |-
        Report whether a receive request is still waiting or has been submitted.

        Never returns ciphertext and never counts as a view, so saved receive requests can
        be checked as often as the rate limit allows.
      parameters:
      - in: path
        name: whisper_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperGone'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhisperGone'
          description: ''
  /api/v1/whisper/request:
    post:
      operationId: whisper_request_create
      description: |-
        Create a receive-mode request.

        The operator sets options (expiry, password, burn) and gets back
        a submit URL (to share) and a view URL (to check later).
      tags:
      - whisper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRequestResponse'
          description: ''
  /api/v1/whisper/submit/{submit_token}:
    get:
      operationId: whisper_submit_retrieve
      description: Return the request's public key for a sender to encrypt to.
      parameters:
      - in: path
        name: submit_token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitRequestKey'
          description: ''
    post:
      operationId: whisper_submit_create
      description: |-
        Submit encrypted data for a receive-mode request.

        Called by the third party who fills in the whisper.
      parameters:
      - in: path
        name: submit_token
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - whisper
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWhisper'
        required: true
      security:
      - apiToken: []
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitWhisperResponse'
          description: ''
components:
  schemas:
    ApiInfo:
      type: object
      properties:
        server_version:
          type: string
        api_version:
          type: integer
        format_versions:
          type: array
          items:
            type: integer
          description: Format versions accepted for new whispers.
        auth:
          $ref: '#/components/schemas/ApiInfoAuth'
        features:
          $ref: '#/components/schemas/ApiInfoFeatures'
        policies:
          $ref: '#/components/schemas/ApiInfoPolicies'
        limits:
          $ref: '#/components/schemas/ApiInfoLimits'
      required:
      - api_version
      - auth
      - features
      - format_versions
      - limits
      - policies
      - server_version
    ApiInfoAuth:
      type: object
      properties:
        login_required:
          type: boolean
          description: Whether creating whispers through the API requires authentication.
        loopback_pkce:
          type: boolean
          description: Whether API tokens can be obtained with the loopback + PKCE
            sign-in.
        manual_code:
          type: boolean
          description: Whether the copy-paste code fallback is available for the sign-in.
        scopes:
          type: array
          items:
            type: string
          description: Scopes an API token can be granted.
      required:
      - login_required
      - loopback_pkce
      - manual_code
      - scopes
    ApiInfoFeatures:
      type: object
      properties:
        email_notifications:
          type: boolean
          description: Whether notify_email is used to send notifications.
        receive_access:
          $ref: '#/components/schemas/ApiInfoReceiveAccess'
        receive_history:
          type: boolean
          description: Whether the web app offers saved receive requests in the browser.
        rich_text:
          type: boolean
          description: 'Whether text envelopes with "format": "markdown" are rendered
            as Markdown.'
      required:
      - email_notifications
      - receive_access
      - receive_history
      - rich_text
    ApiInfoLimits:
      type: object
      properties:
        max_upload_bytes:
          type: integer
          description: Maximum request body size, including ciphertext and base64
            overhead.
        max_views:
          type: integer
          description: Highest accepted max_views value.
        expiry_options:
          type: array
          items:
            type: string
          description: Accepted expiry values.
      required:
      - expiry_options
      - max_upload_bytes
      - max_views
    ApiInfoPolicies:
      type: object
      properties:
        view_requires_auth:
          type: boolean
          description: Whether every reveal requires sign-in, regardless of per-whisper
            options.
        submit_requires_auth:
          type: boolean
          description: Whether every submission requires sign-in, regardless of per-request
            options.
      required:
      - submit_requires_auth
      - view_requires_auth
    ApiInfoReceiveAccess:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether requests accept creator_only and allowed_reader_emails.
        default:
          type: boolean
          description: Whether creator_only defaults to true when omitted.
        required:
          type: boolean
          description: Whether creator_only is always true and cannot be turned off.
      required:
      - default
      - enabled
      - required
    CreateRequest:
      type: object
      properties:
        v:
          allOf:
          - $ref: '#/components/schemas/VEnum'
          description: |-
            Encryption format version (see docs/format.md). Omitted means legacy version 0.

            * `1` - 1
        creator_only:
          type: boolean
        allowed_reader_emails:
          type: array
          items:
            type: string
            format: email
            maxLength: 254
          maxItems: 20
        reveal_token_hash:
          type: string
          description: SHA-256 hex digest of an independent random 256-bit reveal
            token.
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        public_key:
          type: string
          description: X-Wing (ML-KEM-768 + X25519) public key, base64.
          maxLength: 2000
        salt:
          type: string
          default: ''
          maxLength: 50
        wrapped_key:
          type: string
          default: ''
          description: Request private key encrypted with a password-derived key.
          maxLength: 500
        wrapped_key_iv:
          type: string
          default: ''
          maxLength: 50
        max_views:
          type: integer
          maximum: 100
          minimum: 0
          default: 1
          description: Reveals before self-destruction. 1 = burn after read; 0 = unlimited.
        expiry:
          allOf:
          - $ref: '#/components/schemas/ExpiryEnum'
          default: 1d
        allowed_cidr:
          type: string
          default: ''
        require_auth_view:
          type: boolean
          default: false
        require_auth_submit:
          type: boolean
          default: false
        notify_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
      required:
      - public_key
      - reveal_token_hash
    CreateRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        submit_url:
          type: string
          format: uri
        view_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - id
      - submit_url
      - view_url
    CreateWhisper:
      type: object
      properties:
        v:
          allOf:
          - $ref: '#/components/schemas/VEnum'
          description: |-
            Encryption format version (see docs/format.md). Omitted means legacy version 0.

            * `1` - 1
        reveal_token_hash:
          type: string
          description: SHA-256 hex digest of an independent random 256-bit reveal
            token.
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        ciphertext:
          type: string
          maxLength: 70000000
        iv:
          type: string
          maxLength: 50
        salt:
          type: string
          default: ''
          maxLength: 50
        max_views:
          type: integer
          maximum: 100
          minimum: 0
          default: 1
          description: Reveals before self-destruction. 1 = burn after read; 0 = unlimited.
        expiry:
          allOf:
          - $ref: '#/components/schemas/ExpiryEnum'
          default: 1d
        allowed_cidr:
          type: string
          default: ''
        require_auth_view:
          type: boolean
          default: false
        notify_email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
      required:
      - ciphertext
      - iv
      - reveal_token_hash
    CreateWhisperResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
      required:
      - id
      - url
    ExpiryEnum:
      enum:
      - 5m
      - 1h
      - 1d
      - 1w
      - 1M
      type: string
      description: |-
        * `5m` - 5m
        * `1h` - 1h
        * `1d` - 1d
        * `1w` - 1w
        * `1M` - 1M
    GrantTypeEnum:
      enum:
      - authorization_code
      type: string
      description: '* `authorization_code` - authorization_code'
    PatchedReceiveAccess:
      type: object
      properties:
        creator_only:
          type: boolean
        allowed_reader_emails:
          type: array
          items:
            type: string
            format: email
            maxLength: 254
          maxItems: 20
    ReceiveAccess:
      type: object
      properties:
        creator_only:
          type: boolean
        allowed_reader_emails:
          type: array
          items:
            type: string
            format: email
            maxLength: 254
          maxItems: 20
    RevealWhisper:
      type: object
      properties:
        reveal_token:
          description: Reveal token from the view link fragment, required for token-protected
            whispers. Omit only for pre-token whispers. Never send the decryption
            key.
          oneOf:
          - type: string
            default: ''
            maxLength: 64
            pattern: ^[0-9a-f]{64}$
          - type: string
            maxLength: 0
    RevealWhisperResponse:
      type: object
      properties:
        v:
          type: integer
          description: Format version; 0 for legacy whispers.
        ciphertext:
          type: string
        iv:
          type: string
        salt:
          type: string
        encapsulated_key:
          type: string
        wrapped_key:
          type: string
        wrapped_key_iv:
          type: string
        view_count:
          type: integer
        max_views:
          type: integer
        remaining_views:
          type: integer
      required:
      - ciphertext
      - encapsulated_key
      - iv
      - max_views
      - remaining_views
      - salt
      - v
      - view_count
      - wrapped_key
      - wrapped_key_iv
    SubmitRequestKey:
      type: object
      properties:
        public_key:
          type: string
          description: X-Wing public key, base64. Check it against the submit link
            fingerprint.
        v:
          type: integer
          description: Format version of the request.
      required:
      - public_key
      - v
    SubmitWhisper:
      type: object
      properties:
        v:
          allOf:
          - $ref: '#/components/schemas/VEnum'
          description: |-
            Encryption format version (see docs/format.md). Omitted means legacy version 0.

            * `1` - 1
        ciphertext:
          type: string
          maxLength: 70000000
        iv:
          type: string
          maxLength: 50
        encapsulated_key:
          type: string
          maxLength: 2000
      required:
      - ciphertext
      - encapsulated_key
      - iv
    SubmitWhisperResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    TokenExchange:
      type: object
      properties:
        grant_type:
          allOf:
          - $ref: '#/components/schemas/GrantTypeEnum'
          default: authorization_code
        code:
          type: string
          maxLength: 100
        code_verifier:
          type: string
          description: PKCE code verifier (RFC 7636).
          maxLength: 128
        redirect_uri:
          type: string
          description: Exactly the redirect_uri sent to /cli/authorize.
          maxLength: 255
      required:
      - code
      - code_verifier
      - redirect_uri
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: API token, prefixed with psst_.
        token_type:
          type: string
        expires_in:
          type: integer
          description: Seconds until the token expires.
        expires_at:
          type: string
          format: date-time
        scope:
          type: string
          description: Space-separated granted scopes.
      required:
      - access_token
      - expires_at
      - expires_in
      - scope
      - token_type
    VEnum:
      enum:
      - 1
      type: integer
      description: '* `1` - 1'
    WhisperGone:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/WhisperGoneStatusEnum'
          description: |-
            The request expired, was burned, or never existed.

            * `gone` - gone
      required:
      - status
    WhisperGoneStatusEnum:
      enum:
      - gone
      type: string
      description: '* `gone` - gone'
    WhisperStatus:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/WhisperStatusStatusEnum'
          description: |-
            pending: nothing submitted yet; submitted: ready to reveal.

            * `pending` - pending
            * `submitted` - submitted
        expires_at:
          type: string
          format: date-time
        view_count:
          type: integer
        max_views:
          type: integer
          description: 0 = unlimited.
        remaining_views:
          type: integer
          description: 0 when max_views is 0.
      required:
      - expires_at
      - max_views
      - remaining_views
      - status
      - view_count
    WhisperStatusStatusEnum:
      enum:
      - pending
      - submitted
      type: string
      description: |-
        * `pending` - pending
        * `submitted` - submitted
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
